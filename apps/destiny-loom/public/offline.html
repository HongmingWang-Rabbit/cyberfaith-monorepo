<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Destiny Loom</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }
    .glyph {
      font-size: 5rem;
      margin-bottom: 1rem;
      animation: pulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 20px #7c3aed);
    }
    h1 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #7c3aed, #a78bfa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    p { color: #94a3b8; max-width: 320px; line-height: 1.6; }
    .retry {
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .retry:hover { opacity: 0.85; }
    .scanline {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(124, 58, 237, 0.03) 2px, rgba(124, 58, 237, 0.03) 4px
      );
      pointer-events: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <div class="container">
    <div class="glyph">🔮</div>
    <h1>Connection Lost</h1>
    <p>The threads of fate are tangled. Check your connection and try again.</p>
    <button class="retry" onclick="location.reload()">Reconnect</button>
  </div>
</body>
</html>
